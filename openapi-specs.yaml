openapi: 3.0.3
info:
  title: API Generation
  version: 1.0.0
paths:
  /data:
    get:
      operationId: fetchData
      summary: Fetch a simple string
      description: Returns a simple string if present; 404 if not found.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: "hello world"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: "No data available"

